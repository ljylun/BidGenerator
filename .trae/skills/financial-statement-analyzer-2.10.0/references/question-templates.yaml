      - "红灯信号严重度排序"
      - "M-Score偏离度"
      - "勾稽偏差排序"
    expected_output: "Top3关注科目 + 审计程序 + 核查清单"

  - id: "Q13"
    question: "公司的折旧政策是否过于激进？"
