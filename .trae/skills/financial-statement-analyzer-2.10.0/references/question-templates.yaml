      - "期后回款率"
      - "行业对比"
    expected_output: "坏账充足率评估 + 可能需补提金额 + 政策建议"

  - id: "Q10"
    question: "这家公司的报表和已知案例有没有相似之处？"
    category: "案例匹配"
    triggers_modules: ["match_cases"]
    key_indicators:
      - "特征向量"
      - "余弦相似度"
    expected_output: "Top-3相似案例 + 相似度% + 共同特征 + 案例警示"

  - id: "Q11"
    question: "把真实利润还原出来，剔除粉饰因素"
    category: "利润还原"
    triggers_modules: ["compute_ratios", "scan_redflags", "detect_anomalies"]
    key_indicators:
      - "扣非净利"
      - "研发资本化还原"
      - "坏账补提还原"
      - "折旧补提还原"
    expected_output: "真实利润还原表 + 粉饰因素逐项分解 + 还原后利润率"

  - id: "Q12"
    question: "如果是审计师，最应该查哪三个科目？"
    category: "审计建议"
    triggers_modules: ["scan_redflags", "verify_crosschecks", "compute_mscore"]
