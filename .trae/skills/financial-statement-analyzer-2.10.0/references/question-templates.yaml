metadata:
  version: "1.0.0"
  total_templates: 20
  last_updated: "2026-06-14"

templates:
  - id: "Q01"
    question: "这家公司的利润质量如何？有没有虚增？"
    category: "盈利质量"
    triggers_modules: ["compute_ratios", "scan_redflags", "compute_mscore"]
    key_indicators:
      - "扣非净利率/净利率"
      - "经营CF/净利"
      - "应收增长率/收入增长率"
      - "研发资本化率"
    expected_output: "利润质量评级 + 核心证据 + 建议关注科目"

  - id: "Q02"
    question: "现金流为什么比净利润差这么多？"
    category: "现金流分析"
    triggers_modules: ["compute_ratios", "verify_crosschecks"]
    key_indicators:
      - "经营CF/净利趋势"
      - "应收/存货变动"
      - "折旧摊销"
      - "CCC趋势"
    expected_output: "现金流-净利润差异分解 + 间接法还原 + 原因解释"

  - id: "Q03"
    question: "有没有关联方资金占用的迹象？"
    category: "关联交易"
    triggers_modules: ["scan_redflags"]
    key_indicators:
      - "其他应收款/总资产"
      - "预付款项/总资产"
      - "关联应收/总应收"
      - "担保/净资产"
    expected_output: "关联方资金占用可能性评级 + 证据清单 + 核查建议"

  - id: "Q04"
    question: "存货高企的原因是什么？有没有跌价风险？"
    category: "存货分析"
    triggers_modules: ["compute_ratios", "scan_redflags", "detect_anomalies"]
    key_indicators:
      - "存货周转天数趋势"
      - "存货/总资产"
      - "存货跌价准备/存货"
      - "存货增速vs成本增速"
    expected_output: "存货成因分析 + 跌价风险评估 + 库存处置建议"

  - id: "Q05"
    question: "公司的偿债能力怎么样？会不会资金链断裂？"
    category: "偿债能力"
    triggers_modules: ["compute_ratios", "scan_redflags"]
    key_indicators:
      - "流动比率/速动比率/现金比率"
      - "资产负债率"
      - "EBITDA利息覆盖"
      - "短债长投错配检查"
    expected_output: "偿债能力评分 + 流动性压力评估 + 债务期限结构分析"

  - id: "Q06"
    question: "毛利率为什么在收入增长时反而下降？"
    category: "盈利分析"
    triggers_modules: ["compute_ratios", "detect_anomalies"]
    key_indicators:
      - "毛利率趋势"
      - "收入增长率"
      - "成本率变动"
      - "产品结构"
    expected_output: "毛利率变动归因 + 成本驱动因素 + 行业对比"

  - id: "Q07"
    question: "商誉有没有减值风险？"
    category: "商誉分析"
    triggers_modules: ["scan_redflags", "compute_ratios"]
    key_indicators:
      - "商誉/净资产"
      - "收购标的业绩达标情况"
      - "商誉减值损失"
      - "ROIC vs 折现率"
    expected_output: "商誉减值风险评估 + 减值金额预估 + 敏感性分析"

  - id: "Q08"
    question: "研发资本化率为什么这么高？对利润影响多大？"
    category: "研发分析"
    triggers_modules: ["scan_redflags", "compute_ratios"]
    key_indicators:
      - "研发资本化率"
      - "资本化率同比变动"
      - "如费用化对利润率的影响"
      - "同行比较"
    expected_output: "研发资本化合理性评估 + 费用化还原 + 利润影响测算"

  - id: "Q09"
    question: "应收账款的坏账准备计提充足吗？"
    category: "应收账款分析"
    triggers_modules: ["compute_ratios", "scan_redflags"]
    key_indicators:
