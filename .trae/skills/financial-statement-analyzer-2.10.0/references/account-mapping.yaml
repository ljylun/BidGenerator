      - "非流动资产处置损失"
      - "罚款支出"
      - "捐赠支出"
    sign: "debit"

  利润总额:
    level2_codes: []
    computation: "营业利润 + 营业外收入 - 营业外支出"
    sign: "credit"

  所得税费用:
    level2_codes: ["6801"]
    aliases:
      - "所得税"
      - "当期所得税"
      - "递延所得税"
    sign: "debit"

  净利润:
    level2_codes: []
    computation: "利润总额 - 所得税费用"
    sign: "credit"

  归母净利润:
