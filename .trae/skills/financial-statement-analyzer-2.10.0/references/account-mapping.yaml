      - "商誉减值损失"
    sign: "debit"

  营业利润:
    level2_codes: []
    computation: "营业收入 - 营业成本 - 税金及附加 - 销售费用 - 管理费用 - 研发费用 - 财务费用 + 其他收益 + 投资收益 - 信用减值损失 - 资产减值损失"
    sign: "credit"

  营业外收入:
