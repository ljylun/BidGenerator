# ============================================================================
# 三级科目映射字典 (CAS 2019 中国企业会计准则)
# ============================================================================
# 架构:
#   Level 3: 企业原始科目（别名引擎匹配） → 通过正则+fuzzywuzzy匹配
#   Level 2: 标准科目（CAS 2019 标准科目表，核心分析单元）
#   Level 1: 财报项目（三表行项目，用户可读的聚合层）
#
# 作者: 优方皑尔 Uform Ai
# 版本: v1.0.0
# ============================================================================

metadata:
  version: "1.0.0"
  accounting_standard: "CAS 2019"
  last_updated: "2026-06-14"
  total_accounts: 58
  supported_standards:
    - "CAS 2019 (新收入准则)"
    - "CAS 2019 (新租赁准则)"
    - "CAS 2019 (新金融工具准则)"
    - "CAS 2006 (旧准则兼容)"

