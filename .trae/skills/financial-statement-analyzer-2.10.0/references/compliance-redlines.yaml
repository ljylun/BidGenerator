# ============================================================================
# 会计准则红线（8条）
# ============================================================================
accounting_standards:
  - id: "AS-01"
    name: "收入确认合规"
    standard: "CAS 14 收入"
    description: "收入确认应符合履约义务转移原则"
    detection_rules:
      - "合同负债骤降+收入稳定 → 可能提前确认收入"
      - "应收增速>收入增速×1.5 → 收入确认可能过于激进"
      - "关联销售/总销售>30% → 关联交易收入确认需特别关注"
    severity: "P0"

  - id: "AS-02"
    name: "关联方认定完整性"
    standard: "CAS 36 关联方披露"
    description: "关联方关系及其交易应充分披露"
    detection_rules:
      - "其他应收款/总资产>5% → 可能存在未披露关联方资金占用"
      - "预付款项/总资产>10%且账龄>1年 → 可能为关联方预付款"
      - "大额异常往来款出现 → 关联方识别不足"
    severity: "P0"

  - id: "AS-03"
    name: "资产减值测试充分性"
    standard: "CAS 8 资产减值"
    description: "资产存在减值迹象时应进行减值测试"
    detection_rules:
      - "商誉/净资产>30%且3年未减值 → 减值测试可能不足"
      - "存货周转天数同比+50%且未提跌价 → 存货减值可能不足"
      - "固定资产周转率连续下降且未减值 → 固定资产减值可能不足"
    severity: "P0"

  - id: "AS-04"
    name: "研发支出资本化合规"
    standard: "CAS 6 无形资产"
    description: "研发支出资本化需满足5个条件"
    detection_rules:
      - "研发资本化率>30% → 资本化可能过于激进"
      - "研发资本化率同比+10pp → 资本化政策可能变更"
      - "资本化研发支出/净资产>10% → 需重点核查5条件"
    severity: "P1"

  - id: "AS-05"
    name: "或有事项披露完整性"
    standard: "CAS 13 或有事项"
    description: "对外担保、未决诉讼等或有事项应充分披露"
    detection_rules:
      - "关联担保/净资产>30% → 可能未充分披露担保风险"
      - "其他应付款中存在大额诉讼相关 → 未决诉讼需确认预计负债"
    severity: "P1"

  - id: "AS-06"
    name: "合并范围恰当性"
    standard: "CAS 33 合并财务报表"
    description: "合并范围的确定应符合控制原则"
    detection_rules:
      - "少数股东权益占比波动>10pp → 合并范围可能变更"
      - "其他应收款中大量对子公司应收 → 合并范围可能需要调整"
    severity: "P1"

  - id: "AS-07"
    name: "政府补助会计处理"
    standard: "CAS 16 政府补助"
    description: "政府补助应恰当分类为与资产相关或与收益相关"
    detection_rules:
      - "其他收益/利润总额>50% → 过度依赖政府补助"
      - "递延收益剧增 → 政府补助确认方式可能需要审视"
    severity: "P2"

  - id: "AS-08"
    name: "金融工具分类与计量"
    standard: "CAS 22 金融工具确认和计量"
    description: "金融资产应恰当分类并按预期信用损失模型计提减值"
    detection_rules:
      - "应收坏账率<行业均值×0.5 → 预期信用损失模型应用可能不足"
      - "信用减值损失/应收<1% → 坏账计提可能不足"
    severity: "P1"

# ============================================================================
# 证监会监管红线（6条）
# ============================================================================
csrc_regulations:
  - id: "CSRC-01"
    name: "财务类退市风险"
    regulation: "退市新规"
    description: "触及财务类退市指标的公司面临退市风险"
    detection_rules:
      - "扣非净利连续3年<0且营收<1亿 → 触及退市红线"
      - "净资产<0 → 触及退市红线"
      - "审计意见为非标 → 退市风险升级"
    severity: "P0"

  - id: "CSRC-02"
    name: "关联交易审议程序"
    regulation: "上市公司治理准则"
    description: "重大关联交易应经董事会/股东大会审议"
    detection_rules:
      - "关联交易金额/净资产>5% → 需经董事会审议"
      - "关联交易金额/净资产>50% → 需经股东大会审议"
      - "存在未披露的关联交易 → 程序违规"
    severity: "P0"

  - id: "CSRC-03"
    name: "资金占用整改"
    regulation: "关于规范上市公司与关联方资金往来"
    description: "大股东及其关联方不得非经营性占用上市公司资金"
    detection_rules:
      - "其他应收款-关联方/净资产>5% → 资金占用嫌疑"
      - "预付关联方/总预付>30% → 可能变相资金占用"
    severity: "P0"

  - id: "CSRC-04"
    name: "审计意见非标升级"
    regulation: "信息披露管理办法"
    description: "连续非标审计意见需特别警示"
    detection_rules:
      - "上一期审计意见为非标 → 本期待别关注"
      - "连续2期非标 → 存在重大持续性问题"
    severity: "P1"

  - id: "CSRC-05"
    name: "业绩预告偏差"
    regulation: "上市规则"
    description: "业绩预告与实际偏差过大需说明原因"
    detection_rules:
      - "净利润实际值与预告值偏差>50% → 需解释说明"
      - "业绩预告频繁修正 → 财务管理存在缺陷"
    severity: "P2"

  - id: "CSRC-06"
    name: "信息延迟披露"
    regulation: "信息披露管理办法"
    description: "重大信息应及时披露"
    detection_rules:
      - "重大诉讼/担保未及时披露 → 违规"
      - "实际控制人变更未及时公告 → 违规"
      - "重大资产减值未及时预警 → 违规"
    severity: "P1"
